<head>

<style>
  /* 레이아웃: 슬레이트 블루 사이드바(내비게이션) + 밝은 작업 영역. 색은 모두 토큰, 라이트·다크 대응 */
  :root {
    --bg: #F1F4F7; --panel: #FFFFFF; --ink: #16222C; --sub: #4A5763;
    --line: #D3DDE5; --faint: #EEF2F5;

    --nav-bg: #34536B; --nav-ink: #FFFFFF; --nav-sub: #C5D5E0; --nav-line: #4A677E; --nav-active: #22394B; --nav-hover: rgba(255,255,255,.09);
    --shadow: 0 1px 2px rgba(22,34,44,.06), 0 6px 18px rgba(22,34,44,.05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E151B; --panel: #17212A; --ink: #E6ECF1; --sub: #9DADBA;
      --line: #2A3945; --faint: #1C2933;
      --accent: #9DB4C4; --accent-soft: #24394A; --accent-tint: #19262F; --on-accent: #10202C;
      --red: #FF8A80; --red-soft: #3B1F1D; --amber: #EDB45C; --amber-soft: #382A10;
      --nav-bg: #121C25; --nav-ink: #E3EBF0; --nav-sub: #8FA5B5; --nav-line: #25343F; --nav-active: #2B4459; --nav-hover: rgba(255,255,255,.06);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E151B; --panel: #17212A; --ink: #E6ECF1; --sub: #9DADBA;
    --line: #2A3945; --faint: #1C2933;
    --accent: #9DB4C4; --accent-soft: #24394A; --accent-tint: #19262F; --on-accent: #10202C;
    --red: #FF8A80; --red-soft: #3B1F1D; --amber: #EDB45C; --amber-soft: #382A10;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { min-height: 100vh; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  input, select, textarea { background: var(--panel); }
  button:focus-visible, input:focus-visible, select:focus-visible,
  textarea:focus-visible, [role="button"]:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px;
  }
  aside [role="button"]:focus-visible { outline-color: #DCE6ED; }
  table { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--sub); }
  .nav-item { transition: background .12s; }
  .nav-item:hover { background: var(--nav-hover); }
  .btn:not(:disabled):hover { border-color: var(--sub) !important; }
  .btn-primary:not(:disabled):hover { filter: brightness(1.08); border-color: var(--accent) !important; }
  main [style*="border-radius: 12px"] { box-shadow: var(--shadow); }
  .foot { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--sub); line-height: 1.7;
    word-break: keep-all; overflow-wrap: anywhere; text-wrap: pretty;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px 30px; align-items: start; }
  @media (min-width: 1100px) { .foot { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } }
  .foot h2 { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; color: var(--ink); letter-spacing: .01em; }
  .foot p { margin: 0 0 6px; }
  .foot ol, .foot ul { margin: 0; padding-left: 1.25em; }
  .foot li { margin: 0 0 4px; }
  .foot .disc { grid-column: 1 / -1; border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
  .foot .disc strong { color: var(--ink); font-weight: 700; }
  .foot .copy { margin-top: 8px; color: var(--ink); font-weight: 700; }
  .foot .oss { font-size: 11.5px; }
  #boot-error {
    display: none; max-width: 44rem; margin: 15vh auto; padding: 24px 28px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    font-size: 14px; line-height: 1.8; color: var(--ink);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  @media (max-width: 860px) {
    #root > div { flex-direction: column !important; }
    #root > div > aside {
      width: 100% !important; height: auto !important; position: static !important;
    }
    #root > div > aside > nav { max-height: 34vh; }
    #root > div > main { padding: 22px 16px 48px !important; }
  }
</style>

  nm.forEach((c, k) => { if (!om.has(k)) added.push(c); else if (String(om.get(k).pct).replace(/\s/g, "") !== String(c.pct).replace(/\s/g, "")) changed.push({ from: om.get(k), to: c }); });
  om.forEach((c, k) => { if (!nm.has(k)) removed.push(c); });
  return { added, removed, changed, same: !added.length && !removed.length && !changed.length };
}

/* 판정 */
function auVerdict(oldRev, newRev) {
  if (!newRev) return "norev";
  if (!oldRev) return "new";
  const a = auRevKey(newRev), b = auRevKey(oldRev);
  return a > b ? "newer" : a === b ? "same" : "older";
}

/* ===== MSDS 자동 갱신: PDF 읽기 + 화면 ===== */
const AU_PAGE_TOL = 3;

async function auReadPdf(file, onPage) {
  const lib = window.pdfjsLib;
  if (!lib) throw new Error("PDF 라이브러리를 불러오지 못했습니다 (인터넷 연결 확인)");
  if (window.pdfjsWorkerSrc) lib.GlobalWorkerOptions.workerSrc = window.pdfjsWorkerSrc;
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter((it) => it.str && it.str.trim() !== "")
      .map((it) => ({ x: it.transform[4], y: it.transform[5], w: it.width || 0, s: it.str }))
      .sort((a, b) => b.y - a.y || a.x - b.x);
    const rows = [];
    for (const it of items) {
      const cur = rows[rows.length - 1];
      if (cur && Math.abs(cur.y - it.y) <= AU_PAGE_TOL) cur.items.push(it);
      else rows.push({ y: it.y, items: [it] });
    }
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x);
      const cells = [];
      for (const it of r.items) {
        const prev = cells[cells.length - 1];
        const gap = prev ? it.x - prev.x2 : 0;
        if (prev && gap < 4) { prev.s += (gap > 1.2 && !/\s$/.test(prev.s) && !/^\s/.test(it.s) ? " " : "") + it.s; prev.x2 = it.x + it.w; }
        else cells.push({ x: it.x, x2: it.x + it.w, s: it.s });
      }
      cells.forEach((c) => (c.s = c.s.replace(/\s+/g, " ").trim()));
      lines.push({ y: r.y, page: p, cells: cells.filter((c) => c.s) });
    }
    page.cleanup();
    if (onPage) onPage(p, pdf.numPages);
  }
  try { await pdf.destroy(); } catch (e) { }
  return lines;
}

/* 필드 정의: 우선순위 순서대로 열을 차지한다 (먼저 잡힌 열은 뒤 필드가 못 가져감) */
const IMP_FIELDS = [
  { key: "msdsNo", label: "MSDS 번호", re: /msds\s*(번호|no)|관리번호|제출번호/i },

  { key: "name", label: "제품명 *", re: /제품명|상품명|품명|취급물질|물질명\(상품명\)|msds명/i, alt: /화학물질명|물질명|화학제품/ },
  { key: "chem", label: "성분명", re: /함유물질|구성성분|성분명|성분|화학물질명|물질명/ },
  { key: "pct", label: "함유량(%)", re: /함량|함유량|농도|%/ },
  { key: "proc", label: "공정(부서)", re: /공정|부서|사용처|취급장소|비치장소|작업장|사용장소/ },
  { key: "usage", label: "월 취급량", re: /취급량|사용량/ },
  { key: "workers", label: "취급 근로자수", re: /근로자/ },
  { key: "purpose", label: "사용 용도", re: /용도|사용목적/ },
  { key: "maker", label: "제조사", re: /제조사|제조자|제조업체|제조회사|제조원|메이커/ },
  { key: "supplier", label: "공급자", re: /공급자|공급사|공급업체|공급원|납품/ },
  { key: "rev", label: "최종 개정일", re: /개정|rev|작성일/i },
  { key: "ppe", label: "안전보호구", re: /보호구/ },
  { key: "temp", label: "작업 구분(임시·보관)", re: /임시|단시간|작업구분|취급형태/ },
  { key: "f:측정", label: "작업환경측정", re: /작업환경측정/ },
  { key: "f:검진", label: "특수건강검진", re: /특수건강검진|특수검진|특수건강진단/ },
  { key: "f:특별관리", label: "특별관리물질", re: /특별관리/ },
  { key: "f:허가대상", label: "허가대상물질", re: /허가대상/ },
  { key: "f:금지", label: "제조금지물질", re: /제조금지|제조등금지|금지물질/ },
  { key: "f:관리대상", label: "관리대상유해인자", re: /관리대상/ },
  { key: "f:노출기준", label: "노출기준설정", re: /노출기준/ }
];
const impNorm = (v) => String(v == null ? "" : v).replace(/\s+/g, "").toLowerCase();
const impCell = (v) => String(v == null ? "" : v).replace(/\s+/g, " ").trim();

/* 한 행(또는 두 행을 합친) 머리글에서 필드→열 번호를 추정 */
function impGuess(headers) {
  const map = {}, used = new Set();
  const take = (key, re) => {
    if (map[key] != null) return;
    for (let c = 0; c < headers.length; c++) {
      if (used.has(c) || !headers[c]) continue;
      if (re.test(headers[c])) { map[key] = c; used.add(c); return; }
    }
  };
  IMP_FIELDS.forEach((f) => take(f.key, f.re));
  /* 제품명 열이 없고 '화학물질명/물질명' 한 열만 성분으로 잡혔다면 그것이 제품명 */
  if (map.name == null) {
    const f = IMP_FIELDS.find((x) => x.key === "name");
    if (map.chem != null && f.alt.test(headers[map.chem]) && map.cas == null) { map.name = map.chem; delete map.chem; }
    else take("name", f.alt);
  }
  return map;
}

/* 시트에서 머리글 행을 찾는다: 처음 40행 중 필드가 가장 많이 맞는 행 */
function impFindHeader(aoa) {
  let best = null;
  const lim = Math.min(aoa.length, 40);
  for (let r = 0; r < lim; r++) {
    const row = (aoa[r] || []).map(impNorm);
    const filled = row.filter(Boolean).length;
    if (filled < 2) continue;
    let map = impGuess(row);
    let score = Object.keys(map).length + (map.name != null ? 3 : 0);
    let rows = 1, headers = row;
    /* 바로 아래 행이 머리글의 둘째 줄(병합 머리글)인지 확인 */
    const nx = (aoa[r + 1] || []).map(impNorm);
    if (map.name != null && nx.some(Boolean) && !nx[map.name]) {
      const comb = row.map((v, c) => v + (nx[c] || ""));
      for (let c = row.length; c < nx.length; c++) comb[c] = nx[c] || "";
      const m2 = impGuess(comb);
      const gained = Object.keys(m2).length - Object.keys(map).length;
      const nxHits = nx.filter((v) => v && IMP_FIELDS.some((f) => f.re.test(v))).length;
      if (gained > 0 && nxHits > 0) { map = m2; score = Object.keys(m2).length + 3; rows = 2; headers = comb; }
    }
    if (map.name == null) continue;
    if (!best || score > best.score) best = { row: r, rows, map, score, headers };
  }
  return best;
}

const IMP_EMPTY_FLAG = /^(-|–|—|x|n|no|해당없음|해당\s*없음|비대상|미해당|없음|0)?$/i;
const IMP_YES_FLAG = /^(o|○|◯|●|y|yes|해당|대상|v|✓|✔)$/i;
const IMP_EMPTY_CHEM = /^(-|–|—|\.|없음|자료없음|해당없음|\(구성성분 미확인\)|\(성분정보 미등록\))?$/;

/* 엑셀이 날짜로 바꿔 버린 CAS(예: 75-09-2 → 1975-09-02)를 검증숫자로 되살린다 */
function impFixCas(v) {
  const t = impCell(v);
  if (!t) return { cas: "", warn: false };
  if (/^\d{2,7}-\d{2}-\d$/.test(t)) return { cas: t, warn: !auCasValid(t) };
  const m = t.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})(\s|$)/);
  if (m) {
    const mo = m[2].padStart(2, "0"), d = String(Number(m[3]));
    const ok = [m[1] + "-" + mo + "-" + d, m[1].slice(2) + "-" + mo + "-" + d].filter(auCasValid);
    if (ok.length === 1) return { cas: ok[0], warn: false, fixed: true };
  }
  return { cas: t, warn: !/영업\s*비밀|비공개/.test(t) };
}

/* 엑셀 읽기: 날짜 서식 셀은 지역 설정과 무관하게 yyyy-mm-dd 로 읽는다 (개정일, 날짜로 바뀐 CAS 복원용) */
function impReadWorkbook(buf) {
  const wb = XLSX.read(buf, { type: "array", cellDates: false, cellNF: true });
  wb.SheetNames.forEach((n) => {
    const ws = wb.Sheets[n];
    Object.keys(ws).forEach((k) => {
      const c = ws[k];
      if (k[0] === "!" || !c || c.t !== "n" || !c.z || !XLSX.SSF.is_date(c.z)) return;
      const d = XLSX.SSF.parse_date_code(c.v);
      if (d && d.y > 1900) c.w = d.y + "-" + String(d.m).padStart(2, "0") + "-" + String(d.d).padStart(2, "0");
    });
  });
  return wb;
}

/* 표 → 물질 목록 */
function impBuild(aoa, hdr, map, fillDown) {
  const col = (row, k) => (map[k] == null ? "" : impCell(row[map[k]]));
  const tempHead = map.temp == null ? "" : String((hdr.headers || [])[map.temp] || "");
  const prods = [], byKey = new Map();
  let cur = null, lastProc = "", casWarn = 0, casFixed = 0, chemRows = 0, skipped = 0;
  const addChem = (p, row) => {
    const n = col(row, "chem"), rawCas = col(row, "cas");
    if (IMP_EMPTY_CHEM.test(n) && IMP_EMPTY_CHEM.test(rawCas)) return;
    const fx = impFixCas(IMP_EMPTY_CHEM.test(rawCas) ? "" : rawCas);
    if (fx.warn) casWarn++;
    if (fx.fixed) casFixed++;
    const pct = col(row, "pct").replace(/\s*%\s*$/, "");
    const key = fx.cas || "n:" + impNorm(n);
    if (p.chems.some((c) => (c.cas || "n:" + impNorm(c.n)) === key)) return;
    p.chems.push({ n: IMP_EMPTY_CHEM.test(n) ? "" : n, cas: fx.cas, pct });
    chemRows++;
  };
  const addProcs = (p, row, procText) => {
    const names = procText.split(/[,;\n、]+/).map((x) => x.trim()).filter(Boolean);
    names.forEach((proc) => {
      let e = p.processes.find((x) => x.proc === proc);
      if (!e) { e = { proc, ppe: col(row, "ppe") }; p.processes.push(e); }
      if (names.length === 1) {
        if (!e.usage && col(row, "usage")) e.usage = col(row, "usage");
        if (!e.purpose && col(row, "purpose")) e.purpose = col(row, "purpose");
      }
      /* 작업 구분: 칸에 글자로 적혀 있거나, '임시작업' 같은 머리글 아래 O·예 표시가 있는 경우 */
      const t0 = col(row, "temp");
      const t = IMP_YES_FLAG.test(t0) || /^(예|유|있음)$/.test(t0) ? tempHead : t0;
      if (!e.temp && t) e.temp = /보관/.test(t) ? "보관 전용" : /임시|단시간/.test(t) ? "임시작업/단시간작업" : "";
    });
  };
  const addFlags = (p, row) => {
    Object.keys(map).forEach((k) => {
      if (k.indexOf("f:") !== 0) return;
      let v = impCell(row[map[k]]);
      if (IMP_EMPTY_FLAG.test(v)) return;
      if (IMP_YES_FLAG.test(v)) v = "해당";
      const fk = k.slice(2), arr = (p._flags[fk] = p._flags[fk] || []);
      if (!arr.includes(v)) arr.push(v);
    });
  };
  for (let r = hdr.row + hdr.rows; r < aoa.length; r++) {
    const row = aoa[r] || [];
    if (!row.some((v) => impCell(v))) continue;
    const name = col(row, "name");
    let procText = col(row, "proc");
    if (name) {
      if (/^(합계|계|총계|소계|비고|※)/.test(name)) { skipped++; continue; }
      if (!procText && fillDown) procText = lastProc;
      if (procText) lastProc = procText;
      const k = strictKey(name);
      cur = byKey.get(k);
      if (!cur) {
        cur = { name, maker: "", supplier: "", rev: "", msdsNo: "", usage: "", workers: "", purpose: "", ppe: "", processes: [], chems: [], _flags: {} };
        byKey.set(k, cur); prods.push(cur);
      }
      ["maker", "supplier", "msdsNo", "usage", "workers", "purpose", "ppe"].forEach((f) => { if (!cur[f] && col(row, f)) cur[f] = col(row, f); });
      const rv = col(row, "rev");
      if (rv && !cur.rev) cur.rev = auFindDate(rv) || rv;
    } else {
      /* 제품명이 빈 행: 바로 위 제품의 성분·공정이 이어지는 행 */
      if (!cur) { skipped++; continue; }
      if (!col(row, "chem") && !col(row, "cas") && !procText && !Object.keys(map).some((k) => k.indexOf("f:") === 0 && !IMP_EMPTY_FLAG.test(impCell(row[map[k]])))) { skipped++; continue; }
    }
    if (procText) addProcs(cur, row, procText);
    if (map.chem != null || map.cas != null) addChem(cur, row);
    addFlags(cur, row);
  }
  const subs = prods.map((p) => {
    const flagsManual = {};
    Object.keys(p._flags).forEach((k) => (flagsManual[k] = p._flags[k].join(", ")));
    const n = { ...p, flagsManual, src: "excel" };
    delete n._flags;
    if (!n.maker && n.supplier) n.maker = "";
    return n;
  });
  const procs = new Set();
  subs.forEach((s) => s.processes.forEach((p) => procs.add(p.proc)));
  return { subs, stats: { products: subs.length, procs: procs.size, chemRows, casWarn, casFixed, skipped, noChem: subs.filter((s) => !s.chems.length).length, noCas: subs.reduce((n, s) => n + s.chems.filter((c) => !c.cas).length, 0), noProc: subs.filter((s) => !s.processes.length).length } };
}

/* ===== 자료 파일(.xlsx): 엑셀 파일 하나로 저장하고 다시 여는 방식 =====
   '물질 자료' 시트 한 장이 원본. 제품 1건 = 제품명이 적힌 행 + 그 아래 제품명이 빈 행들.
   같은 블록 안에서 공정 열과 성분 열은 서로 독립된 목록이다(행을 맞춰 적을 뿐 짝이 아님). */
const DF_SHEET = "물질 자료";
const DF_META = "앱 정보";
const DF_APP = "msds-share";
const DF_FLAG_KEYS = Object.keys(FLAG_LABELS);
const DF_COLS = [
  ["name", "제품명", 34], ["maker", "제조사", 18], ["supplier", "공급자", 18], ["rev", "최종 개정일", 12], ["msdsNo", "MSDS 번호", 22],
  ["workers", "취급 근로자수", 12], ["usage", "월 취급량(제품)", 14], ["purpose", "사용 용도(제품)", 16], ["ppe", "안전보호구(제품)", 30],
  ["p.proc", "공정(부서)", 16], ["p.usage", "공정 월 취급량", 14], ["p.purpose", "공정 사용 용도", 16], ["p.ppe", "공정 안전보호구", 30], ["p.temp", "작업 구분", 18],
  ["c.n", "성분명", 30], ["c.cas", "CAS No.", 14], ["c.pct", "함유량(%)", 12]
].concat(DF_FLAG_KEYS.map((k) => ["f." + k, FLAG_LABELS[k] + "(직접 입력)", 20]), [["src", "출처", 8], ["id", "앱 ID", 16]]);

function dfBuildWorkbook(subs, org, settings) {
  const txt = (v) => (v == null ? "" : String(v));
  const rows = [DF_COLS.map((c) => c[1])];
  subs.forEach((s) => {
    const procs = s.processes || [], chems = s.chems || [], fm = s.flagsManual || {};
    const n = Math.max(procs.length, chems.length, 1);
    for (let j = 0; j < n; j++) {
      const p = procs[j] || {}, c = chems[j] || {};
      rows.push(DF_COLS.map(([k]) => {
        if (k.indexOf("p.") === 0) return txt(p[k.slice(2)]);
        if (k.indexOf("c.") === 0) return txt(c[k.slice(2)]);
        if (j > 0) return "";
        if (k.indexOf("f.") === 0) return txt(fm[k.slice(2)]);
        return txt(s[k]);
      }));
    }
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  /* 모든 칸을 텍스트로 고정 — 엑셀이 CAS 번호(75-09-2)나 개정일을 날짜·숫자로 바꾸지 않게 */
  Object.keys(ws).forEach((k) => { if (k[0] !== "!") { ws[k].t = "s"; ws[k].z = "@"; } });
  ws["!cols"] = DF_COLS.map((c) => ({ wch: c[2] }));
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: 0, c: DF_COLS.length - 1 } }) };
  const meta = [
    ["MSDS 통합관리 자료 파일"], [""],
    ["형식", DF_APP], ["형식 버전", "1"],
    ["기관명", txt(org.name)], ["담당 부서", txt(org.dept)],
    ["규제 구분 자동 판정", settings.autoReg ? "켜짐" : "꺼짐"],
    ["물질 수", String(subs.length)], ["저장 일시", new Date().toLocaleString("ko-KR")], [""],
    ["사용 방법"],
    ["· 이 파일이 자료의 원본입니다. 웹앱에서 '자료 파일 열기'로 불러오고, 고친 뒤에는 '자료 파일로 저장'으로 새 파일을 받아 보관하세요."],
    ["· '" + DF_SHEET + "' 시트는 엑셀에서 직접 고쳐도 됩니다. 첫 행(머리글)은 그대로 두세요."],
    ["· 제품 1건은 제품명이 적힌 행에서 시작하고, 그 아래 제품명이 빈 행은 같은 제품의 공정·성분이 이어지는 행입니다."],
    ["· 공정 열과 성분 열은 서로 다른 목록입니다. 같은 행에 있어도 '그 공정에서 그 성분을 쓴다'는 뜻은 아닙니다."],
    ["· 새 제품은 맨 아래에 제품명부터 적어 추가하고, '앱 ID' 칸은 비워 두세요. 기존 행의 '앱 ID'는 지우지 마세요(첨부 PDF 연결에 씁니다)."],
    ["· 작업 구분에는 '임시작업/단시간작업' 또는 '보관 전용'을 적고, 상시 취급이면 비워 둡니다."],
    ["· 첨부한 MSDS PDF와 일지함 파일은 이 파일에 들어가지 않습니다. 원본을 따로 보관하세요."]
  ];
  const wm = XLSX.utils.aoa_to_sheet(meta);
  Object.keys(wm).forEach((k) => { if (k[0] !== "!") { wm[k].t = "s"; wm[k].z = "@"; } });
  wm["!cols"] = [{ wch: 24 }, { wch: 60 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, DF_SHEET);
  XLSX.utils.book_append_sheet(wb, wm, DF_META);
  return wb;
}

/* 워크북 → { subs, org, autoReg, stats }  /  이 앱의 자료 파일이 아니면 null */
function dfParseWorkbook(wb) {
  const ws = wb.Sheets[DF_SHEET];
  if (!ws) return null;
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: "", blankrows: false });
  const head = (aoa[0] || []).map((v) => impNorm(v));
  const col = {};
  DF_COLS.forEach(([k, label]) => { const i = head.indexOf(impNorm(label)); if (i >= 0) col[k] = i; });
  if (col.name == null) return null;
  const get = (row, k) => (col[k] == null ? "" : impCell(row[col[k]]));
  const prods = [], byKey = new Map();
  let cur = null, casWarn = 0, casFixed = 0;
  for (let r = 1; r < aoa.length; r++) {
    const row = aoa[r] || [];
    if (!row.some((v) => impCell(v))) continue;
    const name = get(row, "name");
    if (name) {
      const key = strictKey(name);
      cur = byKey.get(key);
      if (!cur) { cur = { ...blankSub(), name, _id: "" }; byKey.set(key, cur); prods.push(cur); }
      ["maker", "supplier", "msdsNo", "workers", "usage", "purpose", "ppe", "src"].forEach((k) => { if (!cur[k] && get(row, k)) cur[k] = get(row, k); });
      if (!cur.rev && get(row, "rev")) cur.rev = auFindDate(get(row, "rev")) || get(row, "rev");
      if (!cur._id && get(row, "id")) cur._id = get(row, "id");
      DF_FLAG_KEYS.forEach((fk) => { const v = get(row, "f." + fk); if (v && v !== "-" && !cur.flagsManual[fk]) cur.flagsManual[fk] = v; });
    } else if (!cur) continue;
    const proc = get(row, "p.proc");
    if (proc && !cur.processes.some((p) => p.proc === proc)) {
      const e = { proc, ppe: get(row, "p.ppe") };
      ["usage", "purpose", "temp"].forEach((k) => { const v = get(row, "p." + k); if (v) e[k] = v; });
      cur.processes.push(e);
    }
    const cn = get(row, "c.n"), cc = get(row, "c.cas");
    if (cn || cc) {
      const fx = impFixCas(cc);
      if (fx.warn) casWarn++;
      if (fx.fixed) casFixed++;
      cur.chems.push({ n: cn, cas: fx.cas, pct: get(row, "c.pct") });
    }
  }
  /* 앱 ID: 중복(행 복사)이면 뒤의 것은 버린다 */
  const seen = new Set();
  const subs = prods.map((p) => {
    const n = { ...p };
    const id = n._id; delete n._id;
    n.id = id && !seen.has(id) ? id : "";
    if (n.id) seen.add(n.id);
    if (!n.src) delete n.src;
    return n;
  });
  const meta = {};
  const wm = wb.Sheets[DF_META];
  if (wm) XLSX.utils.sheet_to_json(wm, { header: 1, raw: false, defval: "" }).forEach((r) => { if (impCell(r[0])) meta[impCell(r[0])] = impCell(r[1]); });
  const org = meta["기관명"] != null || meta["담당 부서"] != null ? { name: meta["기관명"] || "", dept: meta["담당 부서"] || "" } : null;
  const ar = meta["규제 구분 자동 판정"];
  return { subs, org, autoReg: ar === "켜짐" ? true : ar === "꺼짐" ? false : null, stats: { casWarn, casFixed } };
}

/* 파일 → 불러올 자료. 예전 JSON 백업도 받는다. */
async function dfReadFile(file) {
  if (/\.json$/i.test(file.name)) {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== DF_APP || !Array.isArray(data.subs) || data.subs.some((s) => !s || typeof s.name !== "string")) throw new Error("이 앱의 백업 파일이 아닙니다");
    return { subs: data.subs.map((s) => { const n = { ...blankSub(), ...s }; delete n.file; return n; }), org: data.org || null, autoReg: null, stats: { casWarn: 0, casFixed: 0 } };
  }
  if (!/\.(xlsx|xlsm|xls)$/i.test(file.name)) throw new Error("자료 파일(.xlsx)만 열 수 있습니다");
  if (!window.XLSX) throw new Error("엑셀 라이브러리를 불러오지 못했습니다 (인터넷 연결 확인)");
  const res = dfParseWorkbook(impReadWorkbook(await file.arrayBuffer()));
  if (!res) throw new Error("이 앱에서 저장한 자료 파일이 아닙니다. 다른 엑셀 목록은 '엑셀 목록 가져오기'를 이용하세요");
  return res;
}

const dfAgo = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* 사이드바 아래: 열기 / 저장 + 저장 상태 */
function FileBar({ count, fileState, onOpen, onSave }) {
  const h = React.createElement;
  const ref = useRef();
  const [busy, setBusy] = useState(false);
  const dirty = count > 0 && fileState.rev !== fileState.savedRev;
  const btn = (primary) => ({ flex: 1, border: `1px solid ${primary ? C.navInk : C.navLine}`, background: primary ? C.navInk : "transparent", color: primary ? C.navBg : C.navInk, borderRadius: 8, padding: "7px 6px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" });
  const run = async (fn) => { if (busy) return; setBusy(true); try { await fn(); } finally { setBusy(false); } };
  return h("div", { style: { display: "grid", gap: 7 } },
    h("div", { style: { display: "flex", gap: 6 } },
      h("button", { type: "button", style: btn(false), onClick: () => ref.current && ref.current.click() }, "자료 파일 열기"),
      h("button", { type: "button", style: { ...btn(dirty), opacity: count ? 1 : 0.5 }, disabled: !count || busy, onClick: () => run(onSave) }, "자료 파일로 저장")),
    h("input", { ref, type: "file", accept: ".xlsx,.xlsm,.xls,.json", "aria-label": "자료 파일 선택", style: { display: "none" }, onChange: (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) run(() => onOpen(f)); } }),
    h("div", { role: "status", style: { fontSize: 11, lineHeight: 1.5, textAlign: "center", color: dirty ? "#FFD58A" : C.navSub } },
      !count ? "자료 파일(.xlsx)을 열거나 새로 등록하세요"
        : dirty ? (fileState.savedAt ? "파일로 저장하지 않은 변경이 있습니다" : "아직 파일로 저장하지 않았습니다")
        : "파일 저장됨 · " + dfAgo(fileState.savedAt)));
}
